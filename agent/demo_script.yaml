# CapacityX Demo Script: what the demo video and interactive UI show.
# Each turn is typed into the demo UI against the real agent.
# `narrate` describes the situation; make_video.py appends what the decider actually decided.
title: "CapacityX: Autonomous Smart Logistics Decision Agent"
pitch: "An autonomous logistics agent pairing Strands Decider 2B for calibrated action selection with Amazon Bedrock for operational reasoning."
features:
  - "evaluate real-time vehicle telemetry, weather closures, and cold-chain excursions"
  - "select 1 of 5 canonical logistics tools with calibrated confidence in one forward pass"
  - "enforce strict 0.70 confidence threshold and independent human review safeguards"
  - "preview all execution items strictly in simulation mode without live fleet dispatch"
eager: false
intro: "CapacityX is an autonomous logistics dispatch agent. Strands Decider 2B evaluates incident telemetry in milliseconds, selecting the optimal tool with calibrated confidence while Amazon Bedrock provides operational reasoning."
intro_normal: "CapacityX is an autonomous logistics agent running with Strands Decider 2B and Amazon Bedrock. Decider 2B triages incidents into 5 canonical actions, holding uncertain cases for human dispatchers."
turns:
  - say: "INC-809: TRK-104 has engine failure on I-90. Standby unit STANDBY-22 is 18 minutes away. Refrigerated dairy cargo."
    narrate: "Vehicle is immobilized with a nearby standby unit in range."
  - say: "INC-810: TRK-205 is en route on I-80. Blizzard warning has closed the primary pass. Delay 75 minutes, SLA buffer 30 minutes."
    narrate: "Vehicle is operational but faces a closed corridor exceeding SLA buffer."
  - say: "INC-811: TRK-312 suffered axle fracture in an isolated rural zone. 0 standby backup units within 100 miles."
    narrate: "Immobilized vehicle with zero backup units in range mandates immediate dispatcher escalation."
  - say: "INC-812: TRK-410 cruising at 62 mph on US-101. Weather clear, cargo sensors nominal, 15 minutes ahead of schedule."
    narrate: "All telemetry parameters are nominal, maintaining automated heartbeat monitoring."
outro: "One forward pass per decision, calibrated confidence the code can branch on, and Amazon Bedrock for conversational operational reasoning."
